[platformio]
default_envs = esp32c3

[env]
platform = espressif32@6.5.0
framework = arduino
build_type = release
monitor_speed = 115200
monitor_filters =
	esp32_exception_decoder
	default
lib_deps =
	fastled/FastLED@3.10.3        ; 3.10.9 linkt auf dem C3 nicht (PARLIO)
	esphome/ESPAsyncWebServer-esphome@^3.2.2
	;winlinvip/SimpleDHT@^1.0.15
	;me-no-dev/AsyncTCP@^3.3.2
	;paulstoffregen/Encoder@^1.4.4
	;madhephaestus/ESP32Encoder@^0.11.7

; ESP32-C3 Super Mini (USB-C, native USB-Serial/JTAG)
[env:esp32c3]
board = esp32-c3-devkitm-1
upload_protocol = esptool
build_flags =
  -D ARDUINO_USB_MODE=1           ; USB-Serial/JTAG statt externem UART-Chip
  -D ARDUINO_USB_CDC_ON_BOOT=1    ; Serial läuft über USB-C
  -Wno-deprecated-declarations    ; Unterdrückt veraltete Warnungen

; Alte Hardware (ESP32 DevKit V4)
[env:esp32-fastled]
board = az-delivery-devkit-v4
upload_port = COM5
upload_speed = 921600
upload_protocol = esptool
monitor_port = COM5
build_flags =
  -D FASTLED_ESP32_I2S            ; Stabilerer Treiber für ESP32
  -Wno-deprecated-declarations    ; Unterdrückt veraltete Warnungen
